name: Git AI Semantic Indexer

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process-new-circular:
    # Only run on circular submission tickets
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[NEW CIRCULAR]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dump Issue Payload
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "$ISSUE_BODY" > issue_body.txt

      - name: Run Git AI Circular Processor
        if: github.event_name == 'issues'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/process_circular.py issue_body.txt

      - name: Close Issue Ticket
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUM" --comment "✓ Successfully analyzed and added to the official central index by Git AI." || true

      - name: Commit and Push Updated Index
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add circulars_ai_index.json data/circulars_ai_index.json
          if git diff --staged --quiet; then
            echo "Index unchanged."
          else
            git commit -m "chore(ai): index new circular via Git AI [skip ci]"
            # Pull with rebase to prevent race condition push conflicts
            git pull --rebase origin main || true
            git push origin main
          fi
